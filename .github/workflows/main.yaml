name: CI Workflow

on: [push]

jobs:
  devops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t myapp .

      - name: Run Container
        run: docker run -d -p 8080:80 myapp

      - name: Wait for container
        run: sleep 5

      - name: Check output
        run: curl http://localhost:8080
      


